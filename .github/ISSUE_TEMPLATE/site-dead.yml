name: 站点失效 / 关停
description: 某篇里写到的免费站已经打不开、停止服务或改成收费了
title: "[失效] 平台名"
labels: ["data-outdated"]
body:
  - type: markdown
    attributes:
      value: |
        免费站关停很快。这类反馈能直接救下照着文章去注册的读者。
  - type: input
    id: platform
    attributes:
      label: 平台名
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: 具体症状
      options:
        - 网站打不开 / 域名失效
        - 还能打开但已停止免费服务
        - 改成收费了
        - 免费额度大幅缩水
        - 注册入口关闭 / 停止新用户注册
        - 其他（在下方说明）
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 你发现这一情况的日期
      placeholder: 2026-12-01
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 补充说明（可附截图说明或错误页 URL）
  - type: input
    id: related
    attributes:
      label: 相关篇目（如果知道是第几篇写的）
      placeholder: 例如：第 09 篇
