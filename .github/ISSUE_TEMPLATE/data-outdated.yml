name: 数据过期 / 纠错
description: 某篇里的额度、限流、价格、模型数等数据已经不准了
title: "[过期] 第N篇 - 平台名"
labels: ["data-outdated"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你来纠错 —— **时效性纠错是这个仓库最有价值的贡献**。
        请尽量把「原文写的」和「现在的实际值」都写清楚，方便维护者核对后合并。
  - type: input
    id: article
    attributes:
      label: 涉及篇目
      placeholder: 例如：第 10 篇 unorouter 专篇
    validations:
      required: true
  - type: input
    id: outdated-item
    attributes:
      label: 过期的是哪一项
      placeholder: 例如：免费模型数写的是「190–234」
    validations:
      required: true
  - type: textarea
    id: current-value
    attributes:
      label: 现在的实际值
      placeholder: 例如：官网 /models 显示 152 个（核验日期 2026-12-01）
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 可核实来源（URL）
      placeholder: https://...
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我是在官网/实际调用中核对的，不是凭印象或二手转述
          required: true
